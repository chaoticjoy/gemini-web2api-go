name: Release Linux AMD64

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 建 Release、传附件要写权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # tag 和代码里的 Version 常量对不上就直接失败。
      - name: Check tag matches Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' server.go)
          echo "tag=$tag  server.go=$code"
          [ "$tag" = "$code" ] || { echo "::error::tag $tag 与 server.go 里的 $code 不一致"; exit 1; }

      - run: go test ./...

      # CGO_ENABLED=0：SQLite 用的是 modernc.org/sqlite（纯 Go）
      - name: Build linux/amd64
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          ver="${GITHUB_REF_NAME}"
          out="dist/gemini-web2api-go_${ver}_linux_amd64"
          echo "building $out"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "$out" .
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Linux amd64 单二进制，下载直接运行，不需要 Go 也不需要 Docker：

            ```bash
            chmod +x gemini-web2api-go_*
            ./gemini-web2api-go_* --port 8083 --admin-token your-admin-token
            ```

            容器部署见 `ghcr.io/${{ github.repository }}`。
            校验文件完整性用 `SHA256SUMS.txt`。
